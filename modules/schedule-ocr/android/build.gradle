plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nousdeux.scheduleocr'
version = '1.0.0'

android {
  namespace 'com.nousdeux.scheduleocr'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin recognition model: no runtime model download or Cloud Vision API.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
